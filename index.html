<div class="sub">33 soalan objektif · pilih jawapan untuk semakan serta-merta</div>

<script>
const Q=[
[4,"Graf sesaran-masa (S melawan t): garis lurus condong dari O ke P, kemudian garis mengufuk dari P ke Q. Apakah yang dapat disimpulkan tentang gerakan objek?",["Halaju seragam dari O ke P; sesaran sifar dari P ke Q","Halaju sifar dari O ke P; halaju seragam dari P ke Q","Memecut dari O ke P; halaju seragam dari P ke Q","Halaju seragam dari O ke P; berhenti dari P ke Q"],3,"Kecerunan tetap = halaju seragam. Garis mengufuk = sesaran tidak berubah, objek berhenti (bukan sesaran sifar).",""],
[5,"Sebuah lori berjisim besar menekan brek lebih awal. Mengapakah jarak membrek lori lebih panjang berbanding kereta pada kelajuan yang sama?",["Daya impuls pada lori adalah kecil","Impuls lori adalah kecil","Masa perlanggaran lori adalah tinggi","Inersia lori adalah besar"],3,"Jisim besar = inersia besar, lebih sukar dihentikan.",""],
[6,"Seorang pemain hoki memukul bola dan mengikut pergerakan bola selepas dipukul (hayunan susulan). Apakah kesan tindakan itu terhadap bola?",["Mengurangkan daya impuls pada bola","Mengurangkan perubahan momentum bola","Meningkatkan perubahan momentum bola","Mengurangkan halaju bola selepas dipukul"],2,"Hayunan susulan memanjangkan masa sentuhan, impuls bertambah, perubahan momentum bertambah.",""],
[9,"Satelit mengorbit Bumi pada ketinggian 500 km. Jejari Bumi R = 6.37 × 10⁶ m; jejari orbit Bulan = 3.84 × 10⁸ m; tempoh orbit Bulan = 655 jam. Berapakah tempoh orbit satelit?",["0.16 jam","1.58 jam","15.8 jam","158 jam"],1,"T² ∝ r³. r = 6.87 × 10⁶ m. T = 655 × (6.87×10⁶ / 3.84×10⁸)^1.5 ≈ 1.58 jam.",""],
[10,"Sebuah roket dilancarkan dari permukaan Bumi dengan halaju yang mencukupi untuk meninggalkan medan graviti Bumi. Apakah keadaan yang perlu dicapai?",["Halaju kurang daripada halaju lepas","Halaju sama dengan halaju linear","Halaju sekurang-kurangnya sama dengan halaju lepas","Halaju sifar apabila meninggalkan Bumi"],2,"Halaju mesti ≥ halaju lepas.",""],
[11,"Sebotol jus sejuk dibiarkan di atas meja pada suhu bilik. Selepas beberapa ketika, suhu jus sama dengan suhu persekitaran. Konsep manakah yang menerangkan situasi itu?",["Muatan haba tentu","Haba pendam tentu pengewapan","Keseimbangan terma","Haba pendam tentu pelakuran"],2,"Tiada pemindahan haba bersih apabila suhu sama = keseimbangan terma.",""],
[12,"Periuk elektrik memanaskan 1.2 kg sup dari 25°C ke 75°C. c = 4000 J kg⁻¹ °C⁻¹. Berapakah tenaga haba yang diperlukan?",["0.520 × 10⁵ J","1.20 × 10⁵ J","2.40 × 10⁵ J","3.60 × 10⁵ J"],2,"Q = mcθ = 1.2 × 4000 × 50 = 2.40 × 10⁵ J.",""],
[13,"Tayar kereta dipam pada awal pagi. Pada tengah hari, tayar menjadi lebih panas. Apakah yang berlaku kepada tekanan udara dalam tayar?",["Tekanan bertambah kerana suhu udara meningkat","Tekanan berkurang kerana isi padu udara bertambah","Tekanan kekal malar kerana jisim udara tidak berubah","Tekanan menjadi sifar kerana udara mengembang"],0,"Hukum Gay-Lussac: P ∝ T pada isi padu malar.",""],
[14,"Rajah menunjukkan gelombang tuju dipantulkan oleh pemantul satah, dengan garis normal dan sudut α, β, θ, γ. Berdasarkan rajah, apakah hubungan yang betul antara sudut tuju dan sudut pantulan?",["Sudut tuju lebih besar daripada sudut pantulan","Sudut tuju sama dengan sudut pantulan","Sudut tuju lebih kecil daripada sudut pantulan","Sudut tuju dan sudut pantulan sentiasa sifar"],1,"Hukum pantulan: sudut tuju = sudut pantulan.","Rujuk Rajah 7 dalam kertas asal (garis normal ditunjukkan putus-putus)."],
[15,"Gelombang air merambat dari kawasan dalam ke kawasan cetek. Panjang gelombang di kawasan dalam = 15 m, di kawasan cetek = 6 m. Laju di kawasan cetek = 2.0 m s⁻¹. Berapakah laju gelombang di kawasan dalam?",["5.00 m s⁻¹","7.50 m s⁻¹","9.20 m s⁻¹","11.50 m s⁻¹"],0,"Frekuensi malar: v₁/λ₁ = v₂/λ₂, v = 2.0 × 15 / 6 = 5.00 m s⁻¹.",""],
[16,"Satu sinar cahaya merambat dari udara ke kaca. Sudut W dan X berada di sisi udara (W = sudut antara sinar tuju dengan normal), manakala Y dan Z di sisi kaca (Y = sudut antara sinar biasan dengan normal). Apakah indeks biasan kaca itu?",["sin W / sin Y","sin Y / sin W","sin Z / sin X","sin X / sin Z"],0,"n = sin i / sin r, dengan sudut diukur dari normal: sin W / sin Y.","Rujuk Rajah 8."],
[17,"Dua gelombang pada arah bertentangan bertemu di titik Q. Satu denyut mempunyai amplitud +6A (di atas), satu lagi −4A (di bawah). Berapakah sesaran paduan pada Q?",["1A","2A","3A","6A"],1,"Prinsip superposisi: 6A + (−4A) = 2A.",""],
[18,"Antara berikut, yang manakah ciri yang betul bagi gelombang elektromagnet?",["Memerlukan medium untuk merambat","Boleh merambat dalam vakum","Tidak boleh merambat dalam vakum","Terdiri daripada getaran zarah medium sahaja"],1,"Gelombang EM tidak memerlukan medium.",""],
[19,"Dua kabel gentian optik A (sudut genting 33.75°) dan B (sudut genting 41.47°) digunakan dalam telekomunikasi. Pasangan ciri manakah dapat mengurangkan kehilangan maklumat semasa penghantaran?",["Indeks biasan teras dalam tinggi; pantulan dalam penuh rendah","Indeks biasan teras dalam rendah; pantulan dalam penuh tinggi","Indeks biasan teras dalam rendah; pantulan dalam penuh rendah","Indeks biasan teras dalam tinggi; pantulan dalam penuh tinggi"],3,"Teras berindeks biasan tinggi (sudut genting kecil) menjadikan pantulan dalam penuh lebih mudah dan lebih banyak.",""],
[20,"Udara terperangkap dalam picagari. Pada suhu malar, isi padu = 50 cm³ pada 100 kPa. Omboh ditekan hingga isi padu 25 cm³. Berapakah tekanan udara selepas itu?",["50 kPa","100 kPa","150 kPa","200 kPa"],3,"Hukum Boyle: P₁V₁ = P₂V₂, P₂ = 100 × 50 / 25 = 200 kPa.",""],
[21,"Satu papan tanda digantung dengan dua tali (tegangan T₁ pada tali kiri, T₂ pada tali kanan) dan berat W ke bawah. Segitiga daya manakah mewakili situasi itu?",["W mengufuk ke kanan di atas; T₂ dan T₁ bertemu di bawah (Pilihan A)","W menegak ke bawah di kiri; T₁ ke atas-kanan; T₂ ke atas-kiri (Pilihan B)","W menegak ke bawah di kanan; T₁ ke atas-kiri; T₂ ke atas-kanan (Pilihan C)","W mengufuk ke kiri di bawah; T₁ dan T₂ di sisi (Pilihan D)"],1,"W mesti menegak, dan anak panah bersambung kepala-ke-ekor. T₁ (tali kiri) menarik ke atas-kanan, T₂ ke atas-kiri.","Pilihan A–D ialah segitiga dalam Rajah asal (halaman 153); huraian ringkas diberi di sini."],
[22,"Antara situasi berikut, yang manakah menunjukkan objek berada dalam keadaan keseimbangan daya?",["Bola jatuh menegak dengan halaju semakin bertambah","Kereta bergerak dengan halaju malar di atas jalan lurus","Bas memperlahankan pergerakan menghampiri perhentian","Atlet menolak troli dan menyebabkan troli memecut"],1,"Keseimbangan daya: daya bersih sifar, tiada pecutan.",""],
[23,"Graf pemanjangan x melawan daya F untuk spring P dan Q (garis P lebih curam daripada Q). Spring manakah mempunyai pemalar spring lebih besar?",["Tidak dapat ditentukan","Spring P","Spring Q","Kedua-dua spring mempunyai pemalar sama"],2,"Kecerunan = 1/k. Q kurang curam, maka k lebih besar.",""],
[24,"Kereta lumba dilengkapi spoiler yang meningkatkan daya ke bawah pada kelajuan tinggi. Apakah yang berlaku kepada tekanan udara apabila halaju aliran udara meningkat?",["Tekanan udara berkurang","Tekanan udara bertambah","Tekanan udara kekal sama","Tekanan udara menjadi sifar"],0,"Prinsip Bernoulli: halaju tinggi, tekanan rendah.",""],
[25,"Blok logam berjisim 2.0 kg digantung pada neraca spring dan ditenggelamkan sepenuhnya ke dalam air. Bacaan berkurang daripada 20 N kepada 12 N. Ketumpatan air 1000 kg m⁻³. Berapakah isi padu blok?",["4.0 × 10⁻⁴ m³","6.06 × 10⁻⁴ m³","8.0 × 10⁻⁴ m³","3.06 × 10⁻³ m³"],2,"Daya julang = 20 − 12 = 8 N = ρVg, V = 8 / (1000 × 10) = 8.0 × 10⁻⁴ m³.",""],
[26,"Jek hidraulik digunakan untuk mengangkat sebuah kereta. Apakah prinsip fizik yang terlibat?",["Prinsip Archimedes","Prinsip Pascal","Prinsip Bernoulli","Prinsip keabadian tenaga"],1,"Tekanan dipindahkan secara seragam dalam bendalir tertutup = Prinsip Pascal.",""],
[27,"Sistem bekalan air dari menara air ke tangki rumah. Beza tinggi dari aras air menara ke titik Q ialah 50 m. Ketumpatan air 1000 kg m⁻³. Berapakah tekanan air pada Q?",["5.0 × 10⁴ Pa","2.0 × 10⁵ Pa","5.0 × 10⁵ Pa","6.7 × 10⁵ Pa"],2,"P = hρg = 50 × 1000 × 10 = 5.0 × 10⁵ Pa (ketinggian tegak, bukan panjang paip).",""],
[28,"Sekumpulan pendaki mengalami kesukaran bernafas apabila mencapai altitud lebih tinggi. Mengapakah keadaan ini berlaku?",["Ketumpatan udara bertambah apabila altitud meningkat","Jisim udara bertambah apabila altitud meningkat","Tekanan atmosfera berkurang apabila altitud meningkat","Suhu udara bertambah apabila altitud meningkat"],2,"Tekanan atmosfera dan ketumpatan udara berkurang apabila altitud meningkat.",""],
[29,"Dua litar elektrik A dan B mengandungi sel kering dan mentol yang sama. Mentol di litar B lebih terang; wayar litar B lebih tebal. Apakah kesimpulan yang betul?",["Ketebalan wayar tidak mempengaruhi rintangan","Semakin nipis wayar, semakin tinggi arus yang mengalir","Semakin tebal wayar, semakin tinggi rintangan wayar","Semakin tebal wayar, semakin rendah rintangan wayar"],3,"Wayar tebal, rintangan rendah, arus lebih besar, mentol lebih terang.","Rujuk Rajah 18 (Litar B: wayar lebih tebal)."],
[30,"Penggoreng elektrik menggunakan unsur pemanas. Apakah pengubahsuaian yang sesuai untuk meningkatkan kadar penghasilan haba?",["Menggunakan dawai nikrom yang lebih pendek","Menggunakan dawai nikrom yang lebih tebal","Menggunakan dawai nikrom yang lebih halus","Menggunakan dawai nikrom yang lebih panjang"],0,"P = V²/R, rintangan lebih rendah, kuasa lebih tinggi. Nota: dawai lebih pendek dan lebih tebal sama-sama mengurangkan rintangan; sila semak kunci jawapan rasmi.",""],
[31,"Kehilangan tenaga berlaku semasa penghantaran tenaga elektrik dari stesen jana kuasa. Apakah kaedah paling sesuai untuk mengurangkan kehilangan tenaga dalam kabel?",["Meningkatkan arus dalam kabel","Mengurangkan voltan penghantaran","Menggunakan kabel berintangan lebih tinggi","Meningkatkan voltan penghantaran"],3,"Voltan tinggi, arus rendah, kehilangan kuasa (I²R) berkurang.",""],
[32,"Sebatang magnet (hujung N menghadap solenoid, hujung P) berada di hadapan solenoid. Tindakan manakah akan menghasilkan kutub selatan pada Q?",["Magnet ditarik menjauhi solenoid","Magnet pegun di dalam solenoid","Magnet ditolak mendekati solenoid","Kutub magnet disongsangkan dan ditolak mendekati solenoid"],2,"Hukum Lenz: kutub N menghampiri P, P menjadi kutub N (menolak), maka Q menjadi kutub S.","Rujuk Rajah 20: S–N bergerak ke arah hujung P."],
[33,"Transformer ringkas dengan bekalan a.u.; mentol menyala normal. Apakah yang berlaku apabila bekalan a.u. diganti dengan sel kering bervoltan lebih tinggi?",["Mentol tidak menyala","Kecerahan mentol tidak berubah","Kecerahan mentol bertambah","Kecerahan mentol berkurang"],0,"Arus terus tidak menghasilkan perubahan fluks magnet, maka tiada e.m.d. teraruh pada gegelung sekunder.",""],
[34,"Magnet bar digerakkan masuk dan keluar dari gegelung yang disambung kepada galvanometer. Apakah perubahan yang akan menghasilkan arus teraruh lebih besar?",["Menggerakkan magnet dengan lebih perlahan","Mengurangkan bilangan lilitan gegelung","Mengurangkan kekuatan magnet","Menggerakkan magnet dengan lebih laju"],3,"Kadar perubahan fluks lebih tinggi, e.m.d. teraruh lebih besar.",""],
[35,"Graf output pada OSK menunjukkan separuh gelombang dengan penyahcasan perlahan (denyut separuh gelombang yang dilicinkan). Antara berikut, litar manakah menghasilkan output itu?",["Satu diod dan perintang (separuh gelombang, tanpa kapasitor)","Satu diod dan kapasitor selari dengan output","Penerus gelombang penuh (4 diod) dengan kapasitor","Penerus gelombang penuh (4 diod) tanpa kapasitor"],1,"Output hanya separuh kitar dan dilicinkan: penerus separuh gelombang (satu diod) + kapasitor.","Rujuk Rajah 22 dan pilihan litar A–D dalam kertas asal."],
[36,"Paparan OSK menunjukkan pertukaran arus ulang-alik kepada arus terus (gelombang sinus menjadi output separuh gelombang yang dilicinkan). Apakah alat elektronik yang diperlukan?",["Perintang dan kapasitor","Transistor dan kapasitor","Diod dan transistor","Diod dan kapasitor"],3,"Diod menerus; kapasitor melicinkan.",""],
[39,"Penghasilan fotoelektron daripada kesan fotoelektrik. Antara yang berikut, yang manakah menerangkan fotoelektron?",["Pergerakan elektron daripada permukaan logam","Pancaran elektron daripada permukaan logam yang dipanaskan","Pancaran elektron daripada permukaan logam apabila disinari alur cahaya pada frekuensi tertentu","Pergerakan elektron daripada pantulan cahaya"],2,"Fotoelektron dipancarkan apabila cahaya berfrekuensi mencukupi menyinari permukaan logam.",""],
[40,"Antara pernyataan berikut, yang manakah menerangkan Teori Kuantum Max Planck dan Albert Einstein dengan betul?",["Tenaga foton berkadar songsang dengan frekuensi cahaya","Tenaga cahaya wujud dalam bentuk paket tenaga diskrit yang dikenali sebagai foton","Tenaga cahaya dipindahkan secara berterusan dalam semua kuantiti","Tenaga foton tidak bergantung pada frekuensi cahaya"],1,"E = hf: tenaga cahaya wujud dalam paket diskrit (foton).",""]

batan dua gelombang pada arah yang bertentangan dan bertemu di titik Q. Berapakah sesaran paduan pada titik Q?", "19": "Rajah 10 menunjukkan dua kabel gentian optik yang digunakan untuk penghantaran maklumat dalam sistem telekomunikasi. Pasangan ciri manakah dapat mengurangkan kehilangan maklumat semasa penghantaran?", "20": "Rajah 11 menunjukkan udara yang terperangkap dalam sebuah picagari. Pada suhu malar, isi padu udara ialah 50 cm³ apabila tekanan udara ialah 100 kPa. Omboh ditekan sehingga isi padu udara berkurang kepada 25 cm³. Berapakah tekanan udara selepas omboh ditekan?", "21": "Rajah 12 menunjukkan satu papan tanda digantung dengan tali. Segitiga daya manakah mewakili situasi tersebut?", "23": "Rajah 13 menunjukkan graf pemanjangan, x, melawan daya, F, bagi spring P dan Q. Berdasarkan graf tersebut, spring manakah mempunyai pemalar spring yang lebih besar?", "24": "Rajah 14 menunjukkan sebuah kereta lumba yang dilengkapi dengan spoiler. Spoiler membantu meningkatkan daya ke bawah pada kereta apabila bergerak dengan laju. Apakah perubahan yang berlaku pada tekanan udara apabila halaju aliran udara meningkat?", "26": "Rajah 15 menunjukkan jek hidraulik digunakan untuk mengangkat sebuah kereta. Apakah prinsip fizik yang terlibat dalam jek hidraulik?", "27": "Rajah 16 menunjukkan sistem bekalan air dari sebuah menara air ke sebuah tangki air rumah. Berapakah tekanan air pada titik Q? Ketumpatan air ialah 1000 kg m⁻³.", "28": "Rajah 17 menunjukkan sekumpulan pendaki yang mendaki sebuah gunung. Mereka mengalami kesukaran untuk bernafas apabila mencapai altitud yang lebih tinggi. Mengapakah keadaan ini berlaku?", "29": "Rajah 18 menunjukkan dua litar elektrik, A dan B, yang mengandungi sel kering dan mentol yang sama. Apakah kesimpulan yang betul berdasarkan situasi tersebut?", "30": "Rajah 19 menunjukkan sebuah penggoreng elektrik yang menggunakan unsur pemanas. Apakah perubahan yang sesuai pada unsur pemanas untuk meningkatkan kadar penghasilan haba?", "32": "Rajah 20 menunjukkan sebatang magnet di hadapan suatu solenoid. Tindakan manakah akan menghasilkan kutub selatan pada Q?", "33": "Rajah 21 menunjukkan sebuah transformer ringkas dengan bekalan arus ulang-alik, a.u. Mentol menyala dengan kecerahan normal. Apakah yang berlaku apabila bekalan input a.u. diganti dengan sel kering yang mempunyai voltan yang lebih tinggi?", "35": "Rajah 22 menunjukkan graf bagi arus output yang terhasil dalam Osiloskop Sinar Katod (OSK). Antara berikut, litar manakah yang menghasilkan output seperti di atas?", "36": "Rajah 23 menunjukkan paparan OSK dari proses pertukaran arus ulang-alik ke arus terus. Apakah alat elektronik yang diperlukan untuk proses tersebut?", "39": "Rajah 24 menunjukkan penghasilan fotoelektron daripada kesan fotoelektrik. Antara yang berikut, yang manakah menerangkan fotoelektron?"};

function show(){upd();const k=list[i],q=Q[k],a=ans[k];
let h='<div class="card"><p class="q">'+q[0]+'. '+(T[q[0]]||q[1])+'</p>'+(IM[q[0]]?'<div class="im"><img src="'+IM[q[0]]+'" alt="Rajah"></div>':'');
q[2].forEach((t,j)=>{let c='o';if(a!==null){if(j===q[3])c+=' ok';else if(j===a)c+=' no'}h+='<button class="'+c+'" '+(a!==null?'disabled':'')+' onclick="pick('+j+')"><b>'+L[j]+'</b><span>'+(IO[q[0]]?'<img class="oi" src="'+IO[q[0]][j]+'" alt="Pilihan '+L[j]+'">':t)+'</span></button>'});
h+='<div class="ex" id="ex" style="display:'+(a!==null?'block':'none')+'"><b>'+(a===q[3]?'Betul! ':'Jawapan: '+L[q[3]]+'. ')+'</b>'+q[4]+'</div></div>';
h+='<div class="nav"><button class="btn g" onclick="go(-1)" '+(i===0?'disabled':'')+'>Sebelum</button><button class="btn" onclick="go(1)">'+(i===list.length-1?'Keputusan':'Seterusnya')+'</button></div><div class="dots">';
list.forEach((x,n)=>{const v=ans[x];h+='<span class="'+(n===i?'a ':'')+(v===null?'':v===Q[x][3]?'ok':'no')+'" onclick="i='+n+';show()">'+Q[x][0]+'</span>'});
app.innerHTML=h+'</div>'}
function pick(j){const k=list[i];if(ans[k]===null){ans[k]=j;show()}}
function go(d){if(i+d>=list.length)return res();i=Math.max(0,i+d);show()}
function res(t){clearInterval(ti);upd();const n=Q.length,s=sc(),p=Math.round(s/n*100),w=Q.map((_,k)=>k).filter(k=>ans[k]!==Q[k][3]);
app.innerHTML='<div class="card"><div class="c">'+(t===true?'Masa tamat! ':'')+'Masa digunakan: '+fm(el)+' · Keputusan anda</div><div class="sc">'+s+' / '+n+' ('+p+'%)</div><div class="c">'+(p>=80?'Cemerlang!':p>=50?'Baik, teruskan latihan.':'Ulang kaji topik yang salah.')+'</div><div class="c" style="margin-top:8px">Belum dijawab / salah: '+w.length+'</div></div><div class="nav"><button class="btn g" onclick="rs(1)">Ulang soalan salah</button><button class="btn" onclick="rs(0)">Mula semula</button></div>'}
function rs(w){if(w){const k=Q.map((_,x)=>x).filter(x=>ans[x]!==Q[x][3]);if(!k.length)return rs(0);k.forEach(x=>ans[x]=null);list=k}else{ans=Array(Q.length).fill(null);list=Q.map((_,x)=>x)}i=0;if(w){el=0;clearInterval(ti);paint();ti=setInterval(tick,1000);show()}else start()}
let dur=60,el=0,ti=null;
function fm(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function paint(){const r=dur>0?Math.max(dur*60-el,0):el;tm.textContent='⏱ '+fm(r);tm.style.color=dur>0&&dur*60-el<=300?'var(--no)':''}
function tick(){el++;paint();if(dur>0&&el>=dur*60)res(true)}
function begin(){dur=+document.getElementById('du').value;el=0;clearInterval(ti);paint();ti=setInterval(tick,1000);show()}
function start(){clearInterval(ti);tm.textContent='';ans=Array(Q.length).fill(null);list=Q.map((_,x)=>x);i=0;pb.style.width='0';pt.textContent='';st.textContent='';app.innerHTML='<div class="card"><p class="q">Sedia untuk mula?</p><div class="c" style="text-align:left">33 soalan. Pilih tempoh masa:</div><select id="du" style="width:100%;margin-top:10px;padding:10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit"><option value="30">30 minit</option><option value="45">45 minit</option><option value="60" selected>60 minit</option><option value="75">75 minit</option><option value="0">Tiada had (kira masa sahaja)</option></select><div class="nav"><span></span><button class="btn" onclick="begin()">Mula</button></div></div>'}
start()
</script></body></html>
